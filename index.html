<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>股票與 ETF 記帳簿</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="股票記帳">
    <meta name="theme-color" content="#2563eb">
</head>
<body class="bg-gray-50 text-gray-800 pb-12">

    <header class="bg-blue-600 text-white p-4 shadow-md sticky top-0 z-50">
        <div class="max-w-md mx-auto flex justify-between items-center">
            <h1 class="text-lg font-bold">📈 股票記帳簿 (v16)</h1>
            <div class="space-x-2 text-sm">
                <button onclick="exportData()" class="bg-blue-700 px-2.5 py-1 rounded hover:bg-blue-800 transition">備份</button>
                <label class="bg-blue-700 px-2.5 py-1 rounded cursor-pointer hover:bg-blue-800 transition">
                    還原 <input type="file" id="importFile" onchange="importData(event)" class="hidden">
                </label>
            </div>
        </div>
    </header>

    <main class="max-w-md mx-auto p-4 space-y-6">
        <!-- 總覽 -->
        <section class="bg-white p-4 rounded-xl shadow-sm border border-gray-100 space-y-3">
            <div class="grid grid-cols-2 gap-3 text-center">
                <div class="bg-blue-50 p-3 rounded-lg"><p class="text-xs text-gray-500">歷史累計已實現損益</p><p id="totalRealizedPnl" class="text-lg font-bold text-gray-800">$0</p></div>
                <div class="bg-yellow-50 p-3 rounded-lg"><p class="text-xs text-gray-500">歷史累計配息</p><p id="totalDividend" class="text-lg font-bold text-yellow-600">$0</p></div>
            </div>
            <div class="grid grid-cols-2 gap-3 text-center">
                <div class="bg-teal-50 p-3 rounded-lg flex flex-col justify-center"><p class="text-xs text-gray-500">現有持股總市值</p><p id="totalMarketValueAll" class="text-base font-bold text-teal-700">$0</p></div>
                <div class="bg-emerald-50 p-3 rounded-lg flex flex-col justify-center"><p class="text-xs text-gray-500">整體總報酬率</p><p id="totalRoi" class="text-lg font-bold text-emerald-600">0.00%</p></div>
            </div>
        </section>

        <!-- 表單 -->
        <section class="bg-white p-4 rounded-xl shadow-sm border border-gray-100">
            <h2 class="text-md font-semibold mb-3 text-blue-600">✍️ 新增記錄</h2>
            <form id="tradeForm" onsubmit="addTrade(event)" class="space-y-3">
                <div class="grid grid-cols-2 gap-2">
                    <input type="text" id="stockName" required placeholder="代號 (例: 0050)" class="w-full border rounded p-2 text-sm">
                    <select id="assetType" class="w-full border rounded p-2 text-sm bg-white"><option value="ETF">ETF</option><option value="STOCK">一般股票</option></select>
                </div>
                <div class="grid grid-cols-3 gap-2">
                    <select id="tradeType" onchange="toggleFormMode()" class="w-full border rounded p-2 text-sm bg-white"><option value="BUY">買進</option><option value="SELL">賣出</option><option value="DIVIDEND">現金股利</option></select>
                    <input type="number" id="shares" required min="0.001" step="any" placeholder="張數" class="w-full border rounded p-2 text-sm">
                    <input type="number" id="price" required step="0.01" placeholder="單價/配息" class="w-full border rounded p-2 text-sm">
                </div>
                <input type="date" id="tradeDate" required class="w-full border rounded p-2 text-sm">
                <button type="submit" class="w-full bg-blue-600 text-white py-2 rounded-lg text-sm hover:bg-blue-700">儲存紀錄</button>
            </form>
        </section>

        <div id="holdingSummary" class="space-y-3"></div>
        <div id="tradeList" class="space-y-2 max-h-80 overflow-y-auto"></div>
    </main>

    <script>
        let trades = JSON.parse(localStorage.getItem('stock_trades_v16')) || [];
        let closingPrices = JSON.parse(localStorage.getItem('stock_closing_prices')) || {};
        const FEE_RATE = 0.001425;
        document.getElementById('tradeDate').valueAsDate = new Date();

        function toggleFormMode() {
            const type = document.getElementById('tradeType').value;
            document.getElementById('shares').placeholder = type === 'DIVIDEND' ? "發息張數" : "張數";
            document.getElementById('price').placeholder = type === 'DIVIDEND' ? "每股配息" : "單價";
        }

        function saveData() {
            localStorage.setItem('stock_trades_v16', JSON.stringify(trades));
            localStorage.setItem('stock_closing_prices', JSON.stringify(closingPrices));
            render();
        }

        function addTrade(e) {
            e.preventDefault();
            const actualShares = parseFloat(document.getElementById('shares').value) * 1000;
            const price = parseFloat(document.getElementById('price').value);
            const type = document.getElementById('tradeType').value;
            const stockName = document.getElementById('stockName').value.trim();
            const totalAmount = actualShares * price;
            
            trades.push({
                id: Date.now(),
                stockName,
                type,
                date: document.getElementById('tradeDate').value,
                shares: actualShares,
                inputShares: actualShares / 1000,
                price,
                fee: (type === 'BUY' || type === 'SELL') ? totalAmount * FEE_RATE : 0,
                tax: (type === 'SELL') ? totalAmount * (document.getElementById('assetType').value === 'ETF' ? 0.001 : 0.003) : 0,
                dividendTotal: (type === 'DIVIDEND') ? totalAmount : 0
            });
            saveData();
            document.getElementById('tradeForm').reset();
        }

        function updateClosingPrice(name, price) {
            closingPrices[name] = parseFloat(price) || 0;
            saveData();
        }

        function exportData() {
            const blob = new Blob([JSON.stringify({trades, closingPrices})], {type: "application/json"});
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = `backup_${new Date().toISOString().slice(0,10)}.json`;
            a.click();
        }

        function importData(e) {
            const reader = new FileReader();
            reader.onload = (ev) => {
                const data = JSON.parse(ev.target.result);
                trades = data.trades;
                closingPrices = data.closingPrices;
                saveData();
            };
            reader.readAsText(e.target.files[0]);
        }

        function render() {
            const holdingSummary = document.getElementById('holdingSummary');
            const tradeList = document.getElementById('tradeList');
            holdingSummary.innerHTML = '';
            tradeList.innerHTML = '';
            
            let stockMap = {};
            trades.forEach(t => {
                if (!stockMap[t.stockName]) stockMap[t.stockName] = { totalShares: 0, buyRecords: [], totalDividend: 0, dividendHistory: [] };
                let s = stockMap[t.stockName];
                if (t.type === 'BUY') {
                    s.totalShares += t.shares;
                    s.buyRecords.push({ shares: t.shares, price: t.price, fee: t.fee });
                } else if (t.type === 'SELL') {
                    s.totalShares -= t.shares;
                    s.buyRecords.shift(); // 簡易 FIFO
                } else if (t.type === 'DIVIDEND') {
                    s.totalDividend += t.dividendTotal;
                    s.dividendHistory.push({ date: t.date, amount: t.dividendTotal, perShare: t.price, shares: t.inputShares });
                }
            });

            // 渲染持股 (僅顯示 totalShares > 0)
            for (let [name, data] of Object.entries(stockMap)) {
                if (data.totalShares > 0) {
                    let divItems = data.dividendHistory.map(d => `<div class="flex justify-between text-xs text-gray-600"><span>${d.date} (${d.shares}張)</span><span>+$${Math.round(d.amount)}</span></div>`).join('');
                    let divHTML = data.dividendHistory.length > 0 ? `<div class="mt-2 pt-2 border-t text-xs">配息明細:${divItems}<div class="font-bold text-yellow-700">累計: +$${Math.round(data.totalDividend)}</div></div>` : '';
                    
                    let card = document.createElement('div');
                    card.className = 'p-4 rounded-xl bg-white border border-gray-200 text-sm shadow-sm';
                    card.innerHTML = `<div class="font-bold text-base border-b pb-2 mb-2">${name} (持有: ${data.totalShares/1000} 張)</div>
                                      <div class="flex justify-between">收盤價:<input type="number" value="${closingPrices[name]||''}" onchange="updateClosingPrice('${name}', this.value)" class="w-20 border text-right"></div>
                                      ${divHTML}`;
                    holdingSummary.appendChild(card);
                }
            }
            // 簡化歷史渲染...
        }
        render();
    </script>
</body>
</html>
