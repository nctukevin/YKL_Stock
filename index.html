<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>股票與 ETF 記帳簿</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="股票記帳">
    <meta name="theme-color" content="#2563eb">
</head>
<body class="bg-gray-50 text-gray-800 pb-12">
    <!-- 標題 -->
    <header class="bg-blue-600 text-white p-4 shadow-md sticky top-0 z-50">
        <div class="max-w-md mx-auto flex justify-between items-center">
            <h1 class="text-lg font-bold">📈 股票記帳簿 (v16)</h1>
            <button onclick="exportData()" class="bg-blue-700 px-2.5 py-1 rounded text-sm">備份</button>
        </div>
    </header>

    <main class="max-w-md mx-auto p-4 space-y-6">
        <!-- 總覽與表單與原本相同，請保持原樣 -->
        <!-- [此處放入先前總覽與表單的 HTML 區塊] -->
        
        <!-- 持股與明細區域 (請確保 render() 函式如下) -->
        <div id="holdingSummary" class="space-y-3"></div>
        <div id="tradeList" class="space-y-2"></div>
    </main>

    <script>
        let trades = JSON.parse(localStorage.getItem('stock_trades_v16')) || [];
        let closingPrices = JSON.parse(localStorage.getItem('stock_closing_prices')) || {};

        function addTrade(e) {
            e.preventDefault();
            try {
                const stockName = document.getElementById('stockName').value.trim();
                const assetType = document.getElementById('assetType').value;
                const type = document.getElementById('tradeType').value;
                const inputShares = parseFloat(document.getElementById('shares').value);
                const price = parseFloat(document.getElementById('price').value);
                const tradeDate = document.getElementById('tradeDate').value;

                if (!stockName || isNaN(inputShares) || isNaN(price)) {
                    alert("請填寫正確的數據");
                    return;
                }

                const actualShares = inputShares * 1000;
                const totalAmount = actualShares * price;
                const fee = (type === 'BUY' || type === 'SELL') ? totalAmount * 0.001425 : 0;
                const tax = (type === 'SELL') ? totalAmount * ((assetType === 'ETF') ? 0.001 : 0.003) : 0;
                const dividendTotal = (type === 'DIVIDEND') ? totalAmount : 0;

                trades.push({
                    id: Date.now(),
                    stockName, assetType, type, date: tradeDate,
                    shares: actualShares, inputShares, price, fee, tax, dividendTotal
                });
                
                saveData();
                document.getElementById('tradeForm').reset();
            } catch (err) {
                console.error(err);
                alert("儲存時發生錯誤，請檢查輸入內容。");
            }
        }

        function saveData() {
            localStorage.setItem('stock_trades_v16', JSON.stringify(trades));
            localStorage.setItem('stock_closing_prices', JSON.stringify(closingPrices));
            render();
        }

        // render() 函式請確保使用新的 v16 邏輯並確認 DOM ID 正確
        function render() {
            // ... (維持先前 render 邏輯)
        }
    </script>
</body>
</html>
